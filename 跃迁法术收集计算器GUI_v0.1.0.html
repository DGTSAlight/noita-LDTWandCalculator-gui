<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跃迁法术收集计算器 v0.1.0 · Noita</title>
<style>
/* 跃迁法术收集计算器 —— 样式（黑底 + 荧光紫/绿点缀，贴近 Noita 观感） */
/* 与旧版跃迁计算器（v0.7）保持一致的主题变量 */
:root {
  --bg: #0a0718;
  --bg2: #130d2a;
  --card: #1c1438;
  --card2: #261a4a;
  --line: #3a2c6a;
  --line2: #5a4aa0;
  --txt: #ece7ff;
  --dim: #a89fd1;
  --accent: #9d7dff;
  --accent2: #d448ff;
  --ok: #4ade80;
  --warn: #f87171;
  --gold: #fbbf24;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% -10%, rgba(157, 125, 255, .25), transparent 50%),
    radial-gradient(circle at 90% 110%, rgba(212, 72, 255, .18), transparent 50%),
    linear-gradient(180deg, var(--bg), var(--bg2) 60%, #080613);
  color: var(--txt);
  font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
}

/* ---------- 装饰层（沿用 v0.7 的构图，图标改为 Wiki 透明像素图） ---------- */
.deco-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  display: none;
}
.deco-layer.active { display: block; animation: decoIn .6s ease; }
@keyframes decoIn { from { opacity: 0; } to { opacity: 1; } }

.deco-layer .deco {
  position: absolute;
  image-rendering: pixelated;
  opacity: .22;
  filter: drop-shadow(0 0 8px rgba(157, 125, 255, .55));
}
.deco-layer .deco.t1 { left: -22px; top: 10%; width: 148px; transform: rotate(-18deg); opacity: .38; }
.deco-layer .deco.t2 { right: -26px; top: 32%; width: 158px; transform: rotate(22deg) scaleX(-1); opacity: .32; }
.deco-layer .deco.t3 { left: -34px; bottom: -26px; width: 176px; transform: rotate(-6deg); opacity: .26; }
.deco-layer .deco.fu { right: 3%; top: 4%; width: 40px; opacity: .6; animation: bob 3s ease-in-out infinite; }
.deco-layer .deco.fd { left: 2%; bottom: 26%; width: 36px; opacity: .55; animation: bob 2.4s ease-in-out infinite reverse; }
.deco-layer .deco.wn { right: 2%; bottom: 6%; width: 74px; opacity: .4; transform: rotate(-8deg); }

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* 内容压在装饰层之上 */
.topbar, .layout, .foot { position: relative; z-index: 1; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 7, 24, .88);
  backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  font-size: 26px; color: var(--accent);
  text-shadow: 0 0 14px rgba(185, 140, 255, .7);
}
.topbar h1 { margin: 0; font-size: 17px; letter-spacing: .04em; font-weight: 600; }
.sub { margin: 0; color: var(--dim); font-size: 12px; }

.tabs { display: flex; gap: 6px; margin-left: auto; }
.tab {
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card);
  color: var(--dim); font-size: 13px; transition: .18s;
}
.tab:hover { color: var(--txt); border-color: #3d3d55; }
.tab.active {
  color: #0a0a10; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent;
  box-shadow: 0 0 18px rgba(157, 125, 255, .45);
}

/* ---------- 布局 ---------- */
.layout {
  display: grid; grid-template-columns: 300px minmax(0, 1fr);
  gap: 18px; padding: 18px 22px 40px; max-width: 1240px; margin: 0 auto;
}
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

/* ---------- 法术面板 ---------- */
.panel {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; align-self: start; position: sticky; top: 86px;
  max-height: calc(100vh - 110px); display: flex; flex-direction: column;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; }
.panel-head h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .05em; color: var(--accent2); }
.link {
  background: none; border: 0; color: var(--dim); cursor: pointer;
  font-size: 12px; text-decoration: underline; padding: 0;
}
.link:hover { color: var(--txt); }
.search {
  width: 100%; margin: 8px 0 6px; padding: 7px 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  color: var(--txt); font-size: 13px; outline: none;
}
.search:focus { border-color: var(--accent); }
.hint { margin: 0 0 10px; color: #7a7a92; font-size: 11.5px; }
.spell-groups { overflow-y: auto; padding-right: 4px; }
.spell-groups::-webkit-scrollbar { width: 8px; }
.spell-groups::-webkit-scrollbar-thumb { background: #2b2b3d; border-radius: 4px; }

.sgroup { margin-bottom: 10px; }
.sgroup > h3 {
  margin: 0 0 6px; font-size: 11.5px; letter-spacing: .08em;
  color: #7f7f9a; text-transform: uppercase; font-weight: 600;
}
.sitem {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 4px; border-radius: 7px; cursor: pointer;
}
.sitem:hover { background: var(--card2); }
.sitem.on { background: rgba(157, 125, 255, .14); }
.sitem img { width: 24px; height: 24px; image-rendering: pixelated; flex: 0 0 24px; }
.sitem .nm { flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sitem .tag { font-size: 10px; color: var(--accent2); border: 1px solid #2f5b46; border-radius: 4px; padding: 0 4px; }
.sitem input[type=number] {
  width: 46px; padding: 2px 4px; text-align: center;
  background: #0b0b12; border: 1px solid var(--line); border-radius: 5px;
  color: var(--txt); font-size: 12px;
}
.sitem input[type=checkbox] { accent-color: var(--accent); }

/* ---------- 工作区 ---------- */
.workspace { min-width: 0; }
.params, .page-params {
  display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 11.5px; color: var(--dim); letter-spacing: .03em; }
.field input, .field select {
  background: var(--card); border: 1px solid var(--line); border-radius: 7px;
  color: var(--txt); padding: 6px 8px; font-size: 13px; min-width: 110px; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field.small input, .field.small select { min-width: 70px; padding: 3px 6px; font-size: 12px; }
.field .inline { display: flex; gap: 6px; }
.field .inline input { min-width: 78px; }
.field .inline select { min-width: 62px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); cursor: pointer; }
.chk input { accent-color: var(--accent); }
button.primary {
  padding: 9px 22px; border-radius: 8px; border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--ok), #2f9e63);
  color: #04170c; font-weight: 700; font-size: 13.5px; letter-spacing: .04em;
}
button.primary:hover { filter: brightness(1.1); }
button.primary:active { transform: translateY(1px); }

/* ---------- 结果 ---------- */
.results-head {
  display: flex; align-items: center; gap: 12px; margin: 6px 0 10px;
  color: var(--dim); font-size: 12.5px;
}
.results-head .spacer { flex: 1; }
.results { display: flex; flex-direction: column; gap: 10px; }

.sol {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; transition: .15s;
}
.sol:hover { border-color: #3d3d55; }
.sol.over { border-color: #5a3a3a; }
.sol-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
.sol-idx {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  background: #22222f; color: var(--accent); font-weight: 700; font-size: 12px;
}
.metric { font-size: 12.5px; color: var(--dim); }
.metric b { color: var(--txt); font-weight: 600; }
.metric.good b { color: var(--ok); }
.metric.warn b { color: var(--gold); }
.metric.bad b { color: var(--warn); }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--dim);
}
.badge.red { color: var(--warn); border-color: #5a2b2b; background: rgba(255, 107, 107, .08); }
.badge.gold { color: var(--gold); border-color: #5a4a22; background: rgba(255, 209, 102, .08); }

.row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; border-top: 1px dashed #232332; }
.row:first-of-type { border-top: 0; }
.row-label {
  flex: 0 0 88px; font-size: 11.5px; color: #7f7f9a; padding-top: 5px; letter-spacing: .04em;
}
.row-body { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain-note { font-size: 11.5px; color: var(--accent2); margin-left: 4px; }
.warn-note { color: var(--gold); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--card2); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 9px 3px 4px; font-size: 12px;
}
.chip img { width: 18px; height: 18px; image-rendering: pixelated; }
.chip .cnt { color: var(--dim); font-size: 11px; }
.chip.miss { border-color: var(--warn); background: rgba(255, 107, 107, .1); }
.chip.miss .nm { color: #ffb3b3; }
.chip.miss .cnt { color: var(--warn); font-weight: 700; }
.chip.have { opacity: .55; }

.pager { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
.pager button {
  min-width: 32px; padding: 4px 9px; border-radius: 7px; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); color: var(--dim); font-size: 12px;
}
.pager button.on { background: var(--accent); color: #0a0a10; border-color: transparent; font-weight: 700; }

.empty {
  padding: 40px 20px; text-align: center; color: #6f6f88;
  border: 1px dashed var(--line); border-radius: 12px;
}

/* ---------- 自检 ---------- */
.selftest {
  margin-top: 22px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg2); padding: 10px 14px;
}
.selftest summary { cursor: pointer; color: var(--dim); font-size: 12.5px; }
.selftest pre {
  margin: 10px 0 0; padding: 10px; background: #06060a; border-radius: 8px;
  font-size: 11.5px; line-height: 1.55; color: #b9b9cc; max-height: 320px; overflow: auto;
  white-space: pre-wrap;
}

.foot {
  display: flex; gap: 18px; flex-wrap: wrap; justify-content: space-between;
  padding: 14px 22px 26px; color: #5f5f76; font-size: 11.5px;
  border-top: 1px solid var(--line);
}

</style>
</head>
<body>

<!-- 装饰层（图标为 Wiki 透明像素图，随页签切换） -->
<div class="deco-layer active" id="deco-tentacle" aria-hidden="true">
  <img class="deco t1" data-icon="TENTACLE_TIMER" alt="">
  <img class="deco t2" data-icon="TENTACLE_TIMER" alt="">
  <img class="deco t3" data-icon="TENTACLE_TIMER" alt="">
  <img class="deco fu" data-icon="FLY_UPWARDS" alt="">
  <img class="deco fd" data-icon="FLY_DOWNWARDS" alt="">
  <img class="deco wn" data-icon="BLACK_HOLE_DEATH_TRIGGER" alt="">
</div>

<div class="deco-layer" id="deco-blackflash" aria-hidden="true">
  <img class="deco t1" data-icon="BLACK_HOLE" alt="">
  <img class="deco t2" data-icon="LIGHTNING" alt="">
  <img class="deco t3" data-icon="BLACK_HOLE" alt="">
  <img class="deco fu" data-icon="LIFETIME" alt="">
  <img class="deco fd" data-icon="LIGHTNING" alt="">
  <img class="deco wn" data-icon="EXPLODING_DEER" alt="">
</div>

<div class="deco-layer" id="deco-phase" aria-hidden="true">
  <img class="deco t1" data-icon="MEGALASER" alt="">
  <img class="deco t2" data-icon="ADD_DEATH_TRIGGER" alt="">
  <img class="deco t3" data-icon="PHASING_ARC" alt="">
  <img class="deco fu" data-icon="ADD_DEATH_TRIGGER" alt="">
  <img class="deco fd" data-icon="PHASING_ARC" alt="">
  <img class="deco wn" data-icon="MEGALASER" alt="">
</div>


<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <h1>跃迁法术收集计算器</h1>
      <p class="sub">勾选你已有的法术，算出还差什么 · v0.1.0</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-page="tentacle" role="tab">速度触手跃迁</button>
    <button class="tab" data-page="blackflash" role="tab">黑洞闪电弹跃迁</button>
    <button class="tab" data-page="phase" role="tab">相位跃迁</button>
  </nav>
</header>

<main class="layout">

  <!-- ============ 左：法术收集面板 ============ -->
  <aside class="panel" id="collectPanel">
    <div class="panel-head">
      <h2>我的法术</h2>
      <button class="link" id="clearOwned">清空</button>
    </div>
    <input class="search" id="spellSearch" placeholder="搜索法术名 / ID…">
    <p class="hint">勾选＝拥有；数量留空按 1 计。常备法术默认视为已有。</p>
    <div class="spell-groups" id="spellGroups"></div>
  </aside>

  <!-- ============ 右：工作区 ============ -->
  <section class="workspace">

    <!-- 公共参数 -->
    <div class="params">
      <label class="field">
        <span>目标距离</span>
        <select id="targetDist">
          <option value="35840">NG（35840 px）</option>
          <option value="32768">NG+（32768 px）</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <label class="field" id="customDistWrap" hidden>
        <span>自定义距离</span>
        <input type="number" id="customDist" value="35840" min="1" step="1">
      </label>
      <label class="field">
        <span>误差容限</span>
        <span class="inline">
          <input type="number" id="tolerance" value="200" min="0" step="1">
          <select id="tolMode">
            <option value="abs">px</option>
            <option value="rel">%</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span>同种法术最多收集</span>
        <input type="number" id="maxPerSpell" value="3" min="1" step="1">
      </label>
      <label class="field">
        <span>法杖容量</span>
        <input type="number" id="capacity" value="26" min="1" step="1">
      </label>
      <label class="field">
        <span>繁茂洞穴倍率（2/3/4 级）</span>
        <input type="number" id="multFungal" value="2.0" min="0" step="0.1">
      </label>
      <label class="field">
        <span>地狱法杖倍率（10 级）</span>
        <input type="number" id="multHell" value="3.0" min="0" step="0.1">
      </label>
      <label class="chk" title="取消勾选后，零时等可选组件不计入收集难度"><input type="checkbox" id="countOptional" checked> 难度计入可选组件</label>
      <label class="field">
        <span>排序</span>
        <select id="sortMode">
          <option value="weight">收集难度最小（默认）</option>
          <option value="error">误差最小</option>
        </select>
      </label>
      <button class="primary" id="solveBtn">开始计算</button>
    </div>

    <!-- 各页专属参数 -->
    <div class="page-params" id="pp-tentacle">
      <label class="field"><span>最大上/下飞数</span><input type="number" id="ttMaxUpDown" value="100" min="0"></label>
      <label class="field" title="按法术个数计：同种 n 个就占 n 个名额"><span>最大速度修正数（含重复）</span><input type="number" id="ttMaxMods" value="5" min="0" max="10"></label>
      <label class="field"><span>方向</span>
        <select id="ttDir"><option value="down">向下飞行</option><option value="up">向上飞行</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="ttCalibrator" checked> 带校准器</label>
      <label class="chk"><input type="checkbox" id="ttReset" checked> 带刷新环</label>
      <label class="chk"><input type="checkbox" id="ttWrap"> 回绕</label>
    </div>

    <div class="page-params" id="pp-blackflash" hidden>
      <label class="field"><span>法杖速度倍率</span>
        <select id="bfStaff">
          <option value="1">不限（1.0，26 格）</option>
          <option value="1.25">迅捷之杖 1.25（19 格）</option>
          <option value="1.5">多重之杖 1.5（26 格）</option>
          <option value="any" selected>两者都搜</option>
        </select>
      </label>
      <label class="field"><span>最大修正数</span><input type="number" id="bfMaxCorr" value="8" min="0" max="14"></label>
      <label class="field" title="按法术个数计：同种 n 个就占 n 个名额"><span>最大速度修正数（含重复）</span><input type="number" id="bfMaxSpeed" value="5" min="0" max="10"></label>
    </div>

    <div class="page-params" id="pp-phase" hidden>
      <label class="field"><span>最大相位个数</span><input type="number" id="phMaxPhases" value="1600" min="1"></label>
      <label class="field"><span>载荷</span>
        <select id="phPayload">
          <option value="grab">抓取魔弹 + 内在施法</option>
          <option value="orbit">抓取魔弹 + 行星环绕 + 环绕拉帕</option>
          <option value="swap">交换者 + 鹿诱饵 + 伤害修正</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="phCalibrator" checked> 带校准器</label>
      <label class="chk"><input type="checkbox" id="phWrap"> 回绕</label>
    </div>

    <!-- 结果区 -->
    <div class="results-head">
      <span id="resultStat">尚未计算</span>
      <span class="spacer"></span>
      <label class="field small"><span>每页显示</span>
        <select id="pageSize"><option>20</option><option selected>50</option><option>100</option></select>
      </label>
    </div>
    <div id="results" class="results"></div>
    <div class="pager" id="pager"></div>

    <!-- 自检 -->
    <details class="selftest">
      <summary>内置自检（点击运行）</summary>
      <button class="link" id="runSelftest">运行自检</button>
      <pre id="selftestOut"></pre>
    </details>
  </section>
</main>

<footer class="foot">
  <span>数据来源：中文 Noita Wiki（法术等级和生成权重）。权重口径：页面显示百分比，2/3/4 级 × 繁茂倍率、10 级 × 地狱倍率。</span>
  <span>本工具为社区辅助工具，非官方。</span>
</footer>

            if (b.cnt[bi]) nd[f.id] = (nd[f.id] || 0) + b.cnt[bi];
          });
          if (a.slime) nd.SLIMEBALL = (nd.SLIMEBALL || 0) + 1;
          if (b.slime) nd.SLIMEBALL = (nd.SLIMEBALL || 0) + 1;
          payload.forEach(function (id) { nd[id] = (nd[id] || 0) + 1; });

          if (overMaxPerSpell(nd, opt.maxPerSpell)) continue;
          var score = Score.missingCost(nd, owned, guar, opt);
          var slots = Object.keys(nd).reduce(function (s, k) { return s + nd[k]; }, 0);
          // 黑洞存在时间随机（±tvar 帧）导致的距离区间
          var rLo = total, rHi = total;
          if (a.dLo != null) { rLo = a.dLo + b.d; rHi = a.dHi + b.d; }
          out.push({
            page: 'blackflash', bh: a, lt: b, dist: total, error: err,
            rangeLo: rLo, rangeHi: rHi,
            need: nd, slots: slots, overCapacity: slots > (opt.capacity || 26),
            score: score
          });
          if (out.length >= cap * 4) break;
        }
      }

      var uniq = dedupe(out, function (s) {
        return s.bh.cnt.join(',') + '|' + s.bh.staff + s.bh.slime + '|' +
               s.lt.cnt.join(',') + '|' + s.lt.staff + s.lt.slime;
      });
      uniq.sort(opt.sortMode === 'error' ? Score.byError : Score.byWeight);
      return uniq.slice(0, cap);
    }

    return { solve: solve, dist: dist, alphaChain: alphaChain,
             enumCarrier: enumCarrier, SPEED: SPEED, TIME: TIME, CARRIERS: CARRIERS };
  })();

  // ---------------------------------------------------------------- 结果格式化
  var Format = (function () {
    var SPEED_IDS = ['LIGHT_SHOT', 'SPEED', 'SINEWAVE', 'CHAOTIC_ARC', 'DECELERATING_SHOT',
                     'FIZZLE', 'EXPLOSIVE_PROJECTILE', 'PHASING_ARC', 'ACCELERATING_SHOT',
                     'HEAVY_SHOT', 'SLIMEBALL'];
    var TIME_IDS = ['LIFETIME', 'ZERO_DAMAGE', 'LIFETIME_DOWN'];

    function isDn(id) { return /^DIVIDE_\d+$/.test(id); }

    /**
     * 三块分组：复制链 / 速度与回绕 / 其他组件
     * @param {object} sol 求解结果
     * @param {object} owned 已有份数
     * @param {object} guar 常备表
     */
    function blocks(sol, owned, guar) {
      owned = owned || {}; guar = guar || {};
      var need = sol.need;
      var copy = [], speed = [], other = [], optional = [];

      Object.keys(need).forEach(function (id) {
        var n = need[id];
        var o = guar[id] ? n : (owned[id] || 0);
        var lack = Math.max(0, n - o);
        var item = { id: id, need: n, owned: o, lack: lack, noName: true,
                     optional: !!CFG.OPTIONAL_IDS[id],
                     label: lack > 0 ? ('缺 ' + lack + '（有 ' + o + ' / 需 ' + n + '）')
                                     : ('有 ' + o + ' / ' + n) };
        // 复制链行：Dn 链 + 被复制的相位/上下飞 + 刷新环（回绕）
        // 速度修正刻意不放在这一行——它们要避免被回绕
        if (isDn(id) || id === 'PHASING_ARC' || id === 'FLY_UPWARDS' ||
            id === 'FLY_DOWNWARDS' || id === 'RESET') {
          copy.push(item);
        } else if (SPEED_IDS.indexOf(id) >= 0) {
          // 只有「提供速度乘数」的法术进这一行；时间修正归入其他组件
          speed.push(item);
        } else if (item.optional) {
          optional.push(item);
        } else {
          other.push(item);
        }
      });

      // 复制链行内顺序：Dn 链 → 被复制的相位/上下飞 → 刷新环
      copy.sort(function (a, b) {
        function rank(it) {
          if (isDn(it.id)) return 0;
          if (it.id === 'RESET') return 2;
          return 1;
        }
        var d = rank(a) - rank(b);
        if (d !== 0) return d;
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      });

      var blocks = [];
      if (copy.length) {
        blocks.push({ key: 'copy', label: '复制链 + 回绕', items: copy,
                      note: chainNote(sol),
                      hint: (sol.dec && sol.dec.chains.length) ? 'Dn 链可能需要禁抽' : '' });
      }
      if (speed.length) blocks.push({ key: 'speed', label: '额外速度乘数', items: speed });
      if (other.length) blocks.push({ key: 'other', label: '必须组件', items: other });
      if (optional.length) blocks.push({ key: 'optional', label: '可选组件', items: optional });
      return blocks;
    }

    /** 「D10 → D4 → D2 ⇒ 共 80 份相位」 */
    function chainNote(sol) {
      if (!sol.dec) return '';
      var chains = sol.dec.chains.map(function (c) {
        return 'D' + c.digits.join('→D');
      });
      var body = sol.dec.body ? ' + 本体' : '';
      var unit = sol.page === 'phase' ? '份相位' : '份上/下飞';
      return (chains.length ? chains.join(' + ') : '无链') + body +
             ' ⇒ 共 ' + sol.dec.total + ' ' + unit;
    }

    return { blocks: blocks, chainNote: chainNote, isDn: isDn };
  })();

  // ---------------------------------------------------------------- 工具
  function lowerBound(arr, x) {
    var lo = 0, hi = arr.length;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (arr[mid] < x) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  /** 单个法术的所需数量是否超过上限 */
  function overMaxPerSpell(need, maxPerSpell) {
    if (!maxPerSpell) return false;
    for (var k in need) {
      if (Object.prototype.hasOwnProperty.call(need, k) && need[k] > maxPerSpell) return true;
    }
    return false;
  }

  function dnNeedOf(chains) {
    var need = {};
    chains.forEach(function (c) {
      c.digits.forEach(function (d) { need['DIVIDE_' + d] = (need['DIVIDE_' + d] || 0) + 1; });
    });
    return need;
  }

  function dedupe(list, keyFn) {
    var seen = new Set(), out = [];
    list.forEach(function (s) {
      var key = keyFn ? keyFn(s) : JSON.stringify(s.need) + '|' + s.error;
      if (seen.has(key)) return;
      seen.add(key); out.push(s);
    });
    return out;
  }

  return { CFG: CFG, DN: DN, Weights: Weights, Phase: Phase, Score: Score,
           Solve: Solve, Tentacle: Tentacle, BlackFlash: BlackFlash, Format: Format };
});
</script>
<script>/* 跃迁法术收集计算器 —— 界面逻辑（依赖 window.SPELL_DATA / ICON_DATA / LDT） */
(function () {
  'use strict';

  var SPELLS = (window.SPELL_DATA || {}).spells || [];
  var byId = {};
  var guar = {};
  SPELLS.forEach(function (s) {
    byId[s.id] = s;
    if (s.guaranteed) guar[s.id] = 1;
  });

  var ROLE_CN = {
    speed: '速度修正', time: '存在时间修正', updown: '上 / 下飞',
    carrier: '跃迁载体', limit: '存在时间限制器', payload: '载荷与返回',
    aux: '校准器与辅助', dn: '一分为多（Dn）', copy: '复制'
  };
  var ROLE_ORDER = ['speed', 'time', 'updown', 'carrier', 'limit', 'payload', 'aux', 'dn', 'copy'];

  var owned = {};
  var state = { page: 'tentacle', sols: [], pageIdx: 0, pageSize: 50 };

  /* ------------------------------------------------------------ 工具 */
  function $(sel) { return document.querySelector(sel); }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function iconUrl(id) { return (window.ICON_DATA || {})[id] || ''; }

  /** 显示名：优先取 note 的第一段，其次 Wiki 页面名，最后用 ID */
  function dispName(id) {
    var s = byId[id];
    if (!s) return id;
    var n = (s.note || '').split(/[（(：:×]/)[0].trim();
    return n || s.wiki_page || id;
  }

  /** 交换鹿需要非零伤害：优先用已有的，否则用最容易获取的 */
  function pickDamageMod() {
    var mods = LDT.CFG.DAMAGE_MODS;
    for (var i = 0; i < mods.length; i++) {
      if (owned[mods[i]]) return mods[i];
    }
    var best = mods[0], bc = Infinity;
    mods.forEach(function (id) {
      var c = LDT.Score.unitCost(id);
      if (c < bc) { bc = c; best = id; }
    });
    return best;
  }

  function targetDistance() {
    var v = $('#targetDist').value;
    return v === 'custom' ? Math.max(1, +$('#customDist').value || 35840) : +v;
  }

  /* ------------------------------------------------------------ 法术面板 */
  function buildPanel() {
    var wrap = $('#spellGroups');
    wrap.innerHTML = '';
    var groups = {};
    SPELLS.forEach(function (s) {
      (groups[s.role] = groups[s.role] || []).push(s);
    });

    ROLE_ORDER.forEach(function (role) {
      var list = groups[role];
      if (!list || !list.length) return;
      var g = el('div', 'sgroup');
      g.appendChild(el('h3', null, ROLE_CN[role] || role));
      list.forEach(function (s) { g.appendChild(spellRow(s)); });
      wrap.appendChild(g);
    });
  }

  function spellRow(s) {
    var row = el('label', 'sitem');
    row.dataset.id = s.id;
    row.dataset.search = (dispName(s.id) + ' ' + s.id + ' ' + (s.wiki_page || '')).toLowerCase();

    var img = el('img');
    img.src = iconUrl(s.id);
    img.alt = '';
    row.appendChild(img);

    row.appendChild(el('span', 'nm', dispName(s.id)));
    if (s.guaranteed) row.appendChild(el('span', 'tag', '常备'));

    var num = el('input');
    num.type = 'number';
    num.min = '1';
    num.placeholder = '1';
    num.title = '已有数量（留空按 1）';
    num.addEventListener('click', function (e) { e.stopPropagation(); });
    num.addEventListener('input', function () {
      if (owned[s.id]) owned[s.id] = Math.max(1, +num.value || 1);
      refreshRow(row, s.id);
    });

    var chk = el('input');
    chk.type = 'checkbox';
    chk.addEventListener('change', function () {
      if (chk.checked) {
        owned[s.id] = Math.max(1, +num.value || 1);
      } else {
        delete owned[s.id];
      }
      refreshRow(row, s.id);
    });

    row.appendChild(num);
    row.appendChild(chk);
    row._chk = chk; row._num = num;
    return row;
  }

  function refreshRow(row, id) {
    var on = !!owned[id];
    row.classList.toggle('on', on);
    if (row._chk) row._chk.checked = on;
    if (row._num) row._num.value = on ? owned[id] : '';
  }

  /* ------------------------------------------------------------ 参数 */
  function readOpts() {
    var mult = {
      2: +$('#multFungal').value || 0,
      3: +$('#multFungal').value || 0,
      4: +$('#multFungal').value || 0,
      10: +$('#multHell').value || 0
    };
    LDT.Weights.build(SPELLS, { scheme: 'pct', mult: mult });

    var D = targetDistance();
    var tolRaw = Math.max(0, +$('#tolerance').value || 0);
    var tolAbs = $('#tolMode').value === 'rel'
      ? Math.min(0.5, tolRaw / 100) * D
      : tolRaw;

    var common = {
      distance: D,
      tolerance: tolAbs,
      maxPerSpell: Math.max(1, +$('#maxPerSpell').value || 3),
      capacity: Math.max(1, +$('#capacity').value || 26),
      owned: owned,
      guaranteed: guar,
      sortMode: $('#sortMode').value,
      ignoreOptional: !$('#countOptional').checked
    };

    if (state.page === 'tentacle') {
      common.maxUpDown = Math.max(0, +$('#ttMaxUpDown').value || 0);
      common.maxSpeedMods = Math.max(0, +$('#ttMaxMods').value || 0);
      common.flyUp = $('#ttDir').value === 'up';
      common.calibrator = $('#ttCalibrator').checked;
      common.reset = $('#ttReset').checked;
      common.wrap = $('#ttWrap').checked;
      common.limit = 3000;
    } else if (state.page === 'blackflash') {
      common.maxCorrections = Math.max(0, +$('#bfMaxCorr').value || 0);
      common.maxSpeedMods = Math.max(0, +$('#bfMaxSpeed').value || 0);
      var st = $('#bfStaff').value;
      common.staffs = st === 'any' ? [1, 1.25, 1.5] : [parseFloat(st)];
      common.limit = 1000;
    } else {
      common.maxPhases = Math.max(1, +$('#phMaxPhases').value || 1600);
      common.calibrator = $('#phCalibrator').checked;
      common.wrap = $('#phWrap').checked;
      var mode = $('#phPayload').value;
      var presets = LDT.CFG.PAYLOADS;
      common.payload = mode === 'swap'
        ? presets.swap.concat([pickDamageMod()])
        : (presets[mode] || presets.grab);
    }
    return common;
  }

  /* ------------------------------------------------------------ 计算 */
  function solve() {
    var opts = readOpts();
    var t0 = performance.now();
    var sols;
    if (state.page === 'tentacle') sols = LDT.Tentacle.solve(opts);
    else if (state.page === 'blackflash') sols = LDT.BlackFlash.solve(opts);
    else sols = LDT.Solve.phase(opts);
    var ms = Math.round(performance.now() - t0);

    state.sols = sols;
    state.pageIdx = 0;
    $('#resultStat').textContent = sols.length
      ? ('共 ' + sols.length + ' 个可行方案 · 用时 ' + ms + ' ms · 按' +
         ($('#sortMode').value === 'error' ? '误差' : '收集难度（预计获取次数，越小越易凑）') + '排序')
      : ('没有可行方案（用时 ' + ms + ' ms）· 可尝试放宽误差容限或调整上限');
    renderResults();
  }

  /* ------------------------------------------------------------ 渲染 */
  function renderResults() {
    var box = $('#results');
    box.innerHTML = '';
    var sols = state.sols;
    if (!sols.length) {
      box.appendChild(el('div', 'empty', '还没有结果。勾选已拥有的法术，然后点「开始计算」。'));
      $('#pager').innerHTML = '';
      return;
    }
    var start = state.pageIdx * state.pageSize;
    sols.slice(start, start + state.pageSize).forEach(function (sol, i) {
      box.appendChild(solutionCard(sol, start + i + 1));
    });
    renderPager();
  }

  function solutionCard(sol, idx) {
    var card = el('div', 'sol' + (sol.overCapacity ? ' over' : ''));

    var head = el('div', 'sol-head');
    head.appendChild(el('div', 'sol-idx', String(idx)));

    // 误差配色与旧版一致：≤5 绿、≤100 黄、其余红
    var e = sol.error;
    var errCls = e <= 5 ? ' good' : (e <= 100 ? ' warn' : ' bad');
    var rel = sol.dist > 0 ? (e / sol.dist * 100) : 0;
    head.appendChild(metric('误差', e.toFixed(0) + ' px (' + rel.toFixed(3) + '%)', errCls));

    if (sol.page === 'blackflash' && sol.rangeLo != null) {
      var lo = Math.round(sol.rangeLo - sol.dist);
      var hi = Math.round(sol.rangeHi - sol.dist);
      head.appendChild(metric('存在时间区间',
        (lo >= 0 ? '+' : '−') + Math.abs(lo) + ' ~ ' + (hi >= 0 ? '+' : '−') + Math.abs(hi) + ' px', ''));
    }

    head.appendChild(metric('收集难度', fmtInt(Math.round(sol.score.sum)) + ' 次', ''));
    head.appendChild(metric('缺失', sol.score.kinds + ' 种 / ' + sol.score.pieces + ' 个', ''));
    head.appendChild(metric('槽位', sol.slots + ' / ' + (sol.staffCap || 26) + ' 格', ''));

    if (sol.page === 'phase') {
      head.appendChild(badge(sol.combo.label, ''));
      head.appendChild(badge('相位 ' + sol.pEff + ' 份' +
        (sol.pEff !== sol.pPhys ? '（实体 ' + sol.pPhys + '）' : ''), 'gold'));
      if (sol.pEff > LDT.CFG.PHASE.speedZeroAt) {
        head.appendChild(badge('必须配加速', 'red'));
      }
    } else if (sol.page === 'tentacle') {
      head.appendChild(badge('上/下飞 ' + sol.nEff + (sol.nEff !== sol.nPhys ? '（实体 ' + sol.nPhys + '）' : ''), 'gold'));
      head.appendChild(badge('α = ' + sol.alpha.toFixed(4), ''));
      head.appendChild(badge('法杖 ×' + sol.staff + '（' + (sol.staffCap || 26) + ' 格）', ''));
    } else {
      head.appendChild(badge('黑洞 ' + sol.bh.d.toFixed(0) + ' + 闪电弹 ' + sol.lt.d.toFixed(0), ''));
      head.appendChild(badge('法杖 ×' + sol.bh.staff + '（' + (sol.staffCap || 26) + ' 格）', ''));
    }
    if (sol.overCapacity) head.appendChild(badge('超容量', 'red'));
    card.appendChild(head);

    var firstMissing = true;
    LDT.Format.blocks(sol, owned, guar).forEach(function (b) {
      var row = el('div', 'row');
      row.appendChild(el('div', 'row-label', b.label));
      var body = el('div', 'row-body');
      b.items.forEach(function (it) {
        body.appendChild(chip(it, firstMissing));
        if (it.lack > 0) firstMissing = false;
      });
      if (b.note) body.appendChild(el('span', 'chain-note', b.note));
      if (b.hint) body.appendChild(el('span', 'chain-note warn-note', '⚠ ' + b.hint));
      row.appendChild(body);
      card.appendChild(row);
    });
    return card;
  }

  function fmtInt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function metric(label, val, cls) {
    var d = el('div', 'metric' + (cls || ''));
    d.appendChild(document.createTextNode(label + ' '));
    var b = el('b', null, val);
    d.appendChild(b);
    return d;
  }

  function badge(text, cls) {
    return el('span', 'badge' + (cls ? ' ' + cls : ''), text);
  }

  function chip(it, full) {
    var c = el('span', 'chip' + (it.lack > 0 ? ' miss' : ' have'));
    var img = el('img');
    img.src = iconUrl(it.id);
    img.alt = '';
    c.appendChild(img);
    // 卡片内一律不写名字，只留图标（名字见 tooltip），避免臃肿
    var txt;
    if (it.lack > 0) {
      txt = (full ? '缺 ' + it.lack + '（' : '') +
            (full ? '有 ' + it.owned + ' / 需 ' + it.need + '）'
                  : it.lack + '（' + it.owned + '/' + it.need + '）');
    } else {
      txt = '×' + it.need;
    }
    c.appendChild(el('span', 'cnt', txt));
    c.title = dispName(it.id) + ' · ' + it.id +
              '｜需 ' + it.need + ' / 有 ' + it.owned;
    return c;
  }

  function renderPager() {
    var pager = $('#pager');
    pager.innerHTML = '';
    var pages = Math.ceil(state.sols.length / state.pageSize);
    if (pages <= 1) return;
    var cur = state.pageIdx;
    var from = Math.max(0, cur - 4), to = Math.min(pages, from + 10);
    if (to - from < 10) from = Math.max(0, to - 10);

    function btn(label, idx, on) {
      var b = el('button', on ? 'on' : '', label);
      b.addEventListener('click', function () {
        state.pageIdx = idx;
        renderResults();
        $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return b;
    }
    if (cur > 0) pager.appendChild(btn('‹ 上一页', cur - 1));
    for (var i = from; i < to; i++) pager.appendChild(btn(String(i + 1), i, i === cur));
    if (cur < pages - 1) pager.appendChild(btn('下一页 ›', cur + 1));
  }

  /* ------------------------------------------------------------ 自检 */
  function runSelftest() {
    var out = [];
    var pass = 0, fail = 0;
    function ok(name, cond, extra) {
      if (cond) { pass++; out.push('  ✓ ' + name + (extra ? '  ' + extra : '')); }
      else { fail++; out.push('  ✗ ' + name + (extra ? '  ' + extra : '')); }
    }

    out.push('=== 1. 相位跳跃次数 ===');
    ok('定时 100f → 8 次', LDT.Phase.timerJumps(100) === 8);
    ok('限制 200f → 16 次', LDT.Phase.limitJumps(200) === 16);
    ok('限制 300f → 24 次', LDT.Phase.limitJumps(300) === 24);

    out.push('=== 2. Dn 链 ===');
    ok('合法链 116 条', LDT.DN.chains().length === 116, '实际 ' + LDT.DN.chains().length);
    var d80 = LDT.DN.decompose(80, { allowBody: false });
    ok('80 = D10·D4·D2', d80.length > 0,
      d80.length ? d80[0].chains.map(function (c) { return 'D' + c.digits.join(''); }).join('') : '');

    out.push('=== 3. 经典配置 ===');
    var c200 = LDT.Phase.combos().filter(function (c) { return c.limiter && c.limiter.frames === 200; })[0];
    ok('200f + 80 相位 = 35840', LDT.Phase.distance(80, c200.jumps) === 35840);
    var ct = LDT.Phase.combos().filter(function (c) { return c.carrier.kind === 'timer'; })[0];
    ok('定时能量球 + 160 相位 = 35840', LDT.Phase.distance(160, ct.jumps) === 35840);

    out.push('=== 4. 本页求解器（' + ({ tentacle: '速度触手', blackflash: '黑洞闪电弹', phase: '相位跃迁' }[state.page]) + '） ===');
    var opts = readOpts();
    opts.owned = {}; opts.guaranteed = guar;
    var s;
    if (state.page === 'tentacle') s = LDT.Tentacle.solve(opts);
    else if (state.page === 'blackflash') s = LDT.BlackFlash.solve(opts);
    else s = LDT.Solve.phase(opts);
    ok('有可行方案', s.length > 0, s.length + ' 个');
    if (s.length) {
      ok('误差均在容限内', s.every(function (x) { return x.error <= opts.tolerance + 1e-9; }));
      ok('同种法术不超上限', s.every(function (x) {
        return Object.keys(x.need).every(function (k) { return x.need[k] <= opts.maxPerSpell; });
      }));
      var blocks = LDT.Format.blocks(s[0], owned, guar);
      var copyBlk = blocks.filter(function (b) { return b.key === 'copy'; })[0];
      if (copyBlk) {
        var idxDn = copyBlk.items.findIndex(function (i) { return LDT.Format.isDn(i.id); });
        var idxFly = copyBlk.items.findIndex(function (i) {
          return !LDT.Format.isDn(i.id) && i.id !== 'RESET';
        });
        ok('Dn 链排在相位/上下飞之前', idxDn < 0 || idxFly < 0 || idxDn < idxFly,
           'Dn@' + idxDn + ' 相位/上下飞@' + idxFly);
        ok('刷新环在复制链行末尾', copyBlk.items.every(function (i, idx, arr) {
          return i.id !== 'RESET' || idx === arr.length - 1;
        }));
        ok('Dn 链给出禁抽提示', !idxDn || !!copyBlk.hint);
      }
      ok('速度行不含刷新环', !blocks.some(function (b) {
        return b.key === 'speed' && b.items.some(function (i) { return i.id === 'RESET'; });
      }));
    }

    $('#selftestOut').textContent = out.join('\n') + '\n\n=== ' + pass + ' 通过 / ' + fail + ' 失败 ===';
  }

  /* ------------------------------------------------------------ 事件绑定 */
  function switchPage(page) {
    state.page = page;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t.dataset.page === page);
    });
    ['tentacle', 'blackflash', 'phase'].forEach(function (p) {
      var layer = document.getElementById('deco-' + p);
      if (layer) layer.classList.toggle('active', p === page);
    });
    ['tentacle', 'blackflash', 'phase'].forEach(function (p) {
      $('#pp-' + p).hidden = (p !== page);
    });
    state.sols = [];
    state.pageIdx = 0;
    $('#resultStat').textContent = '尚未计算';
    $('#selftestOut').textContent = '';   // 切页重置自检输出
    renderResults();
  }

  function init() {
    // 装饰层图标（base64 内嵌，透明底像素图）
    Array.prototype.forEach.call(document.querySelectorAll('.deco[data-icon]'), function (img) {
      var src = iconUrl(img.dataset.icon);
      if (src) img.src = src;
    });

    buildPanel();

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.addEventListener('click', function () { switchPage(t.dataset.page); });
    });

    $('#targetDist').addEventListener('change', function () {
      $('#customDistWrap').hidden = this.value !== 'custom';
    });

    $('#spellSearch').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('.sitem'), function (r) {
        r.style.display = (!q || r.dataset.search.indexOf(q) >= 0) ? '' : 'none';
      });
    });

    $('#clearOwned').addEventListener('click', function () {
      owned = {};
      Array.prototype.forEach.call(document.querySelectorAll('.sitem'), function (r) {
        refreshRow(r, r.dataset.id);
      });
    });

    $('#solveBtn').addEventListener('click', solve);
    $('#pageSize').addEventListener('change', function () {
      state.pageSize = +this.value;
      state.pageIdx = 0;
      renderResults();
    });
    $('#sortMode').addEventListener('change', function () { if (state.sols.length) solve(); });
    $('#runSelftest').addEventListener('click', runSelftest);

    renderResults();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
